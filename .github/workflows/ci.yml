name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}
      NLTK_DATA: ${{ github.workspace }}/.nltk_data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib nltk seaborn matplotlib
          pip install fastapi uvicorn httpx
          pip install -r requirements-dev.txt

      - name: Download NLTK data
        run: |
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ('stopwords', 'wordnet', 'movie_reviews')]"

      - name: Lint with ruff
        run: ruff check src app.py --exit-zero

      - name: Train ticket classifier artifact
        run: python -m src.train_tickets

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing
